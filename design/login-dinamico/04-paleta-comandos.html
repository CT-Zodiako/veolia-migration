<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ingresar · Veolia · Paleta de comandos</title>
<style>
  :root{--color-bg-page:#0f172a;--color-bg-card:#1e293b;--color-bg-soft:#172033;--color-border:#334155;--color-text-primary:#f1f5f9;--color-text-body:#cbd5e1;--color-text-secondary:#94a3b8;--color-brand-strong:#ffa5a3;--color-brand-medium:#ff6966;--color-brand-accent:#ff2a26;--color-bg-danger-soft:#3f1212;--color-border-danger-soft:#5c2323;--color-text-success:#4ade80;--shell-sidebar-bg:#0b1f3a;--shell-sidebar-bg-active:#1b3459}
  *{box-sizing:border-box}html,body{margin:0;height:100%}
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;line-height:1.5;color:var(--color-text-body);background:var(--color-bg-page);min-height:100vh;display:grid;place-items:center;overflow:hidden}
  .grid{position:fixed;inset:-50%;background-image:linear-gradient(rgba(148,163,184,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,184,.07) 1px,transparent 1px);background-size:48px 48px;transform:perspective(600px) rotateX(55deg);transform-origin:center 60%;animation:scroll 8s linear infinite;mask-image:radial-gradient(ellipse at center,#000 20%,transparent 60%)}
  @keyframes scroll{to{background-position:0 48px}}
  .glow{position:fixed;width:640px;height:320px;border-radius:50%;background:radial-gradient(#f10400,transparent 70%);opacity:.22;filter:blur(40px);top:18%}
  .wrap{position:relative;z-index:1;width:min(94vw,640px)}
  .brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;font-size:13px;color:var(--color-text-secondary)}
  .status{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
  .status i{width:8px;height:8px;border-radius:50%;background:var(--color-text-success);box-shadow:0 0 0 0 rgba(74,222,128,.6);animation:ping 2s infinite}
  @keyframes ping{70%{box-shadow:0 0 0 8px rgba(74,222,128,0)}}
  .pal{background:rgba(30,41,59,.92);backdrop-filter:blur(16px);border:1px solid var(--color-border);border-radius:16px;box-shadow:0 30px 80px -20px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.05);overflow:hidden}
  .crumbs{display:flex;gap:6px;padding:12px 16px;border-bottom:1px solid var(--color-border);font-size:12px;flex-wrap:wrap}
  .crumb{padding:3px 10px;border-radius:999px;background:var(--color-bg-soft);color:var(--color-text-secondary);border:1px solid var(--color-border);transition:all .3s}
  .crumb.on{background:rgba(241,4,0,.14);color:var(--color-brand-strong);border-color:#5c2323}
  .crumb.done{color:var(--color-text-success);border-color:#1e4a2f}
  .bar{display:flex;align-items:center;gap:12px;padding:18px 20px}
  .bar .pr{color:var(--color-brand-medium);font-weight:700;font-size:18px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .bar input{flex:1;background:transparent;border:0;font:inherit;font-size:20px;color:var(--color-text-primary);caret-color:#ff2a26}
  .bar input:focus{outline:none}
  .bar input::placeholder{color:#64748b}
  .bar:focus-within{box-shadow:inset 0 -2px 0 #ff2a26}
  .typer{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;color:var(--color-text-secondary);padding:0 20px 14px;min-height:34px}
  .typer b{color:var(--color-text-body);font-weight:500}
  .msg{margin:0 16px 14px;padding:10px 12px;border-radius:8px;background:var(--color-bg-danger-soft);border:1px solid var(--color-border-danger-soft);color:var(--color-brand-strong);font-size:14px}
  .msg[hidden]{display:none}
  .list{border-top:1px solid var(--color-border);padding:8px;max-height:0;overflow:hidden;transition:max-height .4s ease}
  .list.open{max-height:320px}
  .item{display:flex;align-items:center;gap:14px;width:100%;padding:12px;border:0;border-radius:10px;background:transparent;font:inherit;color:var(--color-text-body);text-align:left;cursor:pointer}
  .item[aria-selected=true],.item:hover{background:var(--shell-sidebar-bg-active)}
  .item:focus-visible{outline:2px solid #ff2a26}
  .item .ic{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:var(--shell-sidebar-bg);border:1px solid var(--color-border);color:var(--color-brand-strong);font-weight:700}
  .item b{color:var(--color-text-primary);display:block;font-weight:600}.item small{color:var(--color-text-secondary)}
  .item kbd{margin-left:auto}
  .foot{display:flex;gap:18px;padding:10px 16px;border-top:1px solid var(--color-border);font-size:12px;color:var(--color-text-secondary);background:var(--color-bg-soft);flex-wrap:wrap}
  kbd{font-family:inherit;font-size:11px;border:1px solid var(--color-border);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--color-text-body);background:var(--color-bg-card)}
  .spin{width:16px;height:16px;border:2px solid #475569;border-top-color:#ff2a26;border-radius:50%;animation:r .7s linear infinite;display:none}
  .busy .spin{display:block}
  @keyframes r{to{transform:rotate(360deg)}}
  .note{text-align:center;font-size:12px;color:var(--color-text-secondary);margin-top:16px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="grid" aria-hidden="true"></div><div class="glow" aria-hidden="true"></div>
<main class="wrap">
  <div class="brand">
    <svg width="96" height="20" viewBox="0 0 96 20" role="img" aria-label="Veolia"><text x="0" y="17" font-family="Segoe UI,system-ui,sans-serif" font-size="17" font-weight="800" fill="#ff2a26" letter-spacing="1">VEOLIA</text></svg>
    <span class="status"><i aria-hidden="true"></i><span id="lat">Servicio disponible · 42 ms</span></span>
  </div>
  <div class="pal" role="dialog" aria-label="Ingreso a la plataforma regulatoria">
    <div class="crumbs" aria-label="Pasos"><span class="crumb on" id="c1">1 · correo</span><span class="crumb" id="c2">2 · contraseña</span><span class="crumb" id="c3">3 · sistema</span></div>
    <form class="bar" id="f" novalidate>
      <span class="pr" aria-hidden="true">›</span>
      <label for="in" id="lbl" style="position:absolute;left:-9999px">Correo electrónico</label>
      <input id="in" type="email" autocomplete="username" placeholder="Escribí tu correo corporativo…" autofocus>
      <span class="spin" aria-hidden="true"></span>
    </form>
    <div class="typer" id="ty" aria-live="polite"></div>
    <div class="msg" id="err" role="alert" hidden></div>
    <div class="list" id="list" role="listbox" aria-label="Sistemas disponibles"></div>
    <div class="foot"><span><kbd>↵</kbd> continuar</span><span><kbd>↑</kbd><kbd>↓</kbd> elegir</span><span><kbd>Esc</kbd> volver</span><span style="margin-left:auto">Plataforma regulatoria de aseo</span></div>
  </div>
  <p class="note">Prototipo: cualquier correo válido · contraseña <b>veolia</b></p>
</main>
<script>
const $=id=>document.getElementById(id);const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const SIS=[['VEO-Regulator','Costos, tarifas e informes gerenciales'],['SUI853','Reportes al Sistema Único de Información'],['Reliquidaciones','Comparación y ajuste de costos']];
let step=1,email='',sel=0;const inp=$('in');
function type(html){const el=$('ty');if(reduce){el.innerHTML=html;return;}const plain=html;el.innerHTML='';let i=0;clearInterval(type.t);type.t=setInterval(()=>{i+=2;el.innerHTML=plain.slice(0,i).replace(/<[^>]*$/,'');if(i>=plain.length)clearInterval(type.t);},14);}
function crumbs(){[1,2,3].forEach(i=>{const c=$('c'+i);c.classList.toggle('on',i===step);c.classList.toggle('done',i<step);if(i<step)c.textContent=c.textContent.replace(/^\d/,'✓');else c.textContent=c.textContent.replace(/^✓/,i);});}
function setStep(n){step=n;$('err').hidden=true;crumbs();$('list').classList.toggle('open',n===3);
  if(n===1){inp.type='email';inp.value=email;inp.placeholder='Escribí tu correo corporativo…';$('lbl').textContent='Correo electrónico';inp.autocomplete='username';inp.disabled=false;type('Hola. Empezá por tu <b>correo de Veolia</b>.');}
  if(n===2){inp.type='password';inp.value='';inp.placeholder='Contraseña';$('lbl').textContent='Contraseña';inp.autocomplete='current-password';inp.disabled=false;type(`Cuenta <b>${email}</b> · ahora tu contraseña.`);}
  if(n===3){inp.type='text';inp.value='';inp.placeholder='Filtrá sistemas…';$('lbl').textContent='Filtrar sistemas';inp.autocomplete='off';type('Credenciales correctas ✓ · elegí a qué sistema entrar.');render('');}
  inp.focus();}
function render(q){const items=SIS.filter(s=>s[0].toLowerCase().includes(q.toLowerCase()));sel=Math.min(sel,Math.max(items.length-1,0));
  $('list').innerHTML=items.length?items.map(([n,d],i)=>`<button class="item" type="button" role="option" aria-selected="${i===sel}"><span class="ic">${n[0]}</span><span><b>${n}</b><small>${d}</small></span>${i===sel?'<kbd>↵</kbd>':''}</button>`).join(''):'<p style="padding:12px;margin:0;color:#94a3b8;font-size:14px">Ningún sistema coincide con el filtro.</p>';}
function err(t){$('err').textContent=t;$('err').hidden=false;}
function enter(n){const b=$('list').querySelectorAll('.item')[n];if(!b)return;b.querySelector('small').textContent='Ingresando…';type(`Abriendo <b>${b.querySelector('b').textContent}</b>…`);}
$('f').onsubmit=e=>{e.preventDefault();const v=inp.value.trim();
  if(step===1){if(!v)return err('El email es obligatorio');if(!/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(v))return err('El email no es valido');email=v;setStep(2);}
  else if(step===2){if(!inp.value)return err('El pass es obligatorio');$('f').classList.add('busy');inp.disabled=true;type('Validando credenciales…');
    setTimeout(()=>{$('f').classList.remove('busy');inp.disabled=false;if(inp.value!=='veolia'){err('Usuario o Pass Incorrecto');type(`Cuenta <b>${email}</b> · revisá tu contraseña.`);inp.select();inp.focus();return;}setStep(3);},1000);}
  else enter(sel);};
inp.addEventListener('input',()=>{if(step===3){sel=0;render(inp.value)}});
inp.addEventListener('keydown',e=>{if(e.key==='Escape'&&step>1){e.preventDefault();setStep(step-1);}
  if(step===3&&(e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();const n=$('list').querySelectorAll('.item').length;sel=(sel+(e.key==='ArrowDown'?1:-1)+n)%n;render(inp.value);}});
$('list').onclick=e=>{const b=e.target.closest('.item');if(b)enter([...$('list').children].indexOf(b));};
setInterval(()=>{$('lat').textContent=`Servicio disponible · ${38+Math.round(Math.random()*12)} ms`},3000);
setStep(1);
</script>
</body>
</html>

<div class="card-section">
  <p-message *ngIf="estado()" severity="info" [text]="estado()" styleClass="w-full mb-3"></p-message>

  <div class="form-grid">
    <div class="form-group">
      <label for="terc-cdf">CDF</label>
      <p-inputnumber inputId="terc-cdf" [(ngModel)]="cdf" mode="decimal" [minFractionDigits]="0" [maxFractionDigits]="4" styleClass="w-full" placeholder="Costo Disposición Final"></p-inputnumber>
    </div>

    <div class="form-group">
      <label for="terc-ctl">CTL</label>
      <p-inputnumber inputId="terc-ctl" [(ngModel)]="ctl" mode="decimal" [minFractionDigits]="0" [maxFractionDigits]="4" styleClass="w-full" placeholder="Costo de Tratamiento de Lixiviados"></p-inputnumber>
    </div>

    <div class="form-group">
      <label for="terc-incen">Incen. CDF</label>
      <p-inputnumber inputId="terc-incen" [(ngModel)]="incentivo" mode="decimal" [minFractionDigits]="0" [maxFractionDigits]="4" styleClass="w-full" placeholder="Incentivo Costo Disposición Final"></p-inputnumber>
    </div>
  </div>

  <div class="guardar-row">
    <button pButton label="Guardar Información de Terceros" icon="pi pi-save" [loading]="guardando()" (click)="guardar()"></button>
  </div>
</div>

<section>
  <div class="card-section">
    <app-parametros-consulta
      [wrapInCard]="false"
      [mostrarAps]="true"
      [mostrarBoton]="false"
      [autoConsultar]="true"
      [aps]="aps()"
      (apsChange)="aps.set($event)"
      [anno]="anno()"
      (annoChange)="anno.set($event)"
      [mes]="mes()"
      (mesChange)="mes.set($event)"
      (consultar)="consultar()"
      (parametrosIncompletos)="limpiar()">
    </app-parametros-consulta>
  </div>

  <div class="card-section flex gap-2 align-items-center">
    <button
      pButton
      label="CERTIFICAR"
      severity="warn"
      icon="pi pi-check"
      [loading]="certificando()"
      [disabled]="!filtrosValidos() || tarifasExistentes() !== false"
      (click)="certificar()">
    </button>
  </div>

  <p-message *ngIf="estado()" severity="info" [text]="estado()" styleClass="w-full mb-3"></p-message>
  <p-message *ngIf="error()" severity="error" [text]="error()" styleClass="w-full mb-3"></p-message>

  <div class="card-section" *ngIf="verificando()">
    <p class="loading-text">Verificando tarifas existentes...</p>
  </div>

  <div class="card-section" *ngIf="filtrosValidos() && tarifasExistentes() === true">
    <p-message severity="warn" text="Ya existen tarifas calculadas para el APS y período seleccionado."></p-message>
  </div>

  <div class="card-section" *ngIf="!filtrosValidos()">
    <p-message severity="warn" text="Debe seleccionar una APS, año y mes primero."></p-message>
  </div>

  <div *ngIf="mostrarTabs()">
    <p-tabs [value]="currentTab()" (valueChange)="onTabChange($event)">
      <p-tablist>
        <p-tab value="PROPIA">Inf. Propia</p-tab>
        <p-tab value="COMPETIDOR">Inf. Competidor</p-tab>
        <p-tab value="USUARIOS">Inf. Usuarios</p-tab>
        <p-tab value="TERCEROS">Inf. Terceros</p-tab>
      </p-tablist>
      <p-tabpanels>
        <p-tabpanel value="PROPIA">
          <app-inf-propia [aps]="aps()!" [anno]="anno()!" [mes]="mes()!" (guardado)="onGuardadoHijo()"></app-inf-propia>
        </p-tabpanel>
        <p-tabpanel value="COMPETIDOR">
          <app-inf-competidor [aps]="aps()!" [anno]="anno()!" [mes]="mes()!" (guardado)="onGuardadoHijo()"></app-inf-competidor>
        </p-tabpanel>
        <p-tabpanel value="USUARIOS">
          <app-cargue-comercial [aps]="aps()!" [anno]="anno()!" [mes]="mes()!" (guardado)="onGuardadoHijo()"></app-cargue-comercial>
        </p-tabpanel>
        <p-tabpanel value="TERCEROS">
          <app-inf-terceros [aps]="aps()!" [anno]="anno()!" [mes]="mes()!" (guardado)="onGuardadoHijo()"></app-inf-terceros>
        </p-tabpanel>
      </p-tabpanels>
    </p-tabs>
  </div>
</section>

<p-dialog header="Resultado Certificación PGIRS" [visible]="mostrarModal()" [closable]="false" [modal]="true" [style]="{ 'max-width': '480px' }">
  <p-table [value]="datosModal()">
    <ng-template pTemplate="header">
      <tr><th>Variable</th><th>Valor</th><th>PGIRS</th></tr>
    </ng-template>
    <ng-template pTemplate="body" let-row>
      <tr>
        <td>{{ row.variable }}</td>
        <td [ngClass]="claseCelda(row.color)">{{ row.valor }}</td>
        <td class="celda-pgirs">{{ row.pgirs }}</td>
      </tr>
    </ng-template>
  </p-table>
  <div class="modal-footer">
    <button pButton label="Cerrar" severity="secondary" (click)="cerrarModal()"></button>
  </div>
</p-dialog>

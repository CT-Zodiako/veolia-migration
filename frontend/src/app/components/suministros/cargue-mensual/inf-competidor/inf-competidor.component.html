<div class="card-section">
  <div class="form-group">
    <label>Empresa</label>
    <p-select
      [options]="empresas()"
      [ngModel]="empresaSeleccionada()"
      (ngModelChange)="empresaSeleccionada.set($event)"
      optionLabel="EMPR_NOMBRE"
      optionValue="EMPR_EMPR"
      placeholder="Seleccione empresa"
      [showClear]="true"
      styleClass="w-full">
    </p-select>
  </div>

  <p-message *ngIf="estado()" severity="info" [text]="estado()" styleClass="w-full mb-3 mt-3"></p-message>

  <div class="cargue-header">
    <h4>Cargue de Información Competidor</h4>
    <a class="descarga-plano" (click)="descargarPlano()">⚡ Descargar Plano Guía</a>
  </div>

  <div class="file-row">
    <input type="file" accept=".csv" (change)="onArchivoSeleccionado($event)" [disabled]="empresaSeleccionada() === null" #fileInput />
    <span class="file-name" *ngIf="nombreArchivo()">{{ nombreArchivo() }}</span>
    <button pButton label="Cancelar" severity="danger" [outlined]="true" [disabled]="!nombreArchivo()" (click)="cancelarCargue(); fileInput.value = ''"></button>
  </div>

  <div *ngIf="errores().length" class="errores-box">
    <p-message *ngFor="let err of errores()" severity="error" [text]="err" styleClass="w-full mb-2"></p-message>
  </div>

  <div *ngIf="filas().length">
    <h4>Vista Previa</h4>
    <app-tabla-avanzada
      [columnas]="columnasPreview"
      [rows]="filas()"
      [autoWidth]="true"
      storageKey="cargue-mensual-inf-competidor"
      nombreExportar="Inf_Competidor_Mensual">
    </app-tabla-avanzada>

    <div class="guardar-row">
      <button pButton label="Guardar Información Competidor" icon="pi pi-save" [loading]="guardando()" (click)="guardar()"></button>
    </div>
  </div>
</div>

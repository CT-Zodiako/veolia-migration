<div class="card-section">
  <p-message *ngIf="estado()" severity="info" [text]="estado()" styleClass="w-full mb-3"></p-message>

  <app-cargue-archivo-pasos
    titulo="Cargue de Información de Usuarios"
    [planoGuiaUrl]="planoGuiaUrl"
    [planoGuiaMeta]="planoGuiaMeta"
    planoGuiaDescripcion="Formato con las columnas del Inf. Usuarios (CODAPS a TONELADAS)."
    accept=".csv"
    [periodoDestino]="periodoDestino"
    [estado]="estadoCargue()"
    [errores]="errores()"
    [resumen]="{ filas: filas().length }"
    guardarLabel="Guardar Información de Usuarios"
    (archivoSeleccionado)="onArchivoSeleccionado($event)"
    (archivoQuitado)="cancelarCargue()"
    (cancelar)="cancelarCargue()"
    (guardar)="guardar()">
  </app-cargue-archivo-pasos>

  <div *ngIf="filas().length" class="preview">
    <div class="resumen-grid">
      <div class="resumen-card">
        <h4>Resumen x Variables</h4>
        <table class="resumen-table">
          <tbody>
            <tr><td>N</td><td>{{ resumenVariables().n }}</td></tr>
            <tr><td>ND</td><td>{{ resumenVariables().nd }}</td></tr>
            <tr><td>NA</td><td>{{ resumenVariables().na }}</td></tr>
            <tr><td>TAFNA</td><td>{{ resumenVariables().tafna }}</td></tr>
          </tbody>
        </table>
      </div>

      <div class="resumen-card">
        <h4>Resumen x Estratos</h4>
        <table class="resumen-table">
          <thead><tr><th>Estrato</th><th>Cantidad</th><th>Toneladas</th></tr></thead>
          <tbody>
            <tr *ngFor="let fila of resumenEstratos()">
              <td>{{ fila.nomuso }}</td>
              <td>{{ fila.cantidad }}</td>
              <td>{{ fila.toneladas }}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <h4>Vista Previa del Archivo</h4>
    <app-tabla-avanzada
      [columnas]="columnasPreview"
      [rows]="filas()"
      [autoWidth]="true"
      storageKey="cargue-mensual-comercial"
      nombreExportar="Inf_Usuarios_Mensual">
    </app-tabla-avanzada>
  </div>
</div>

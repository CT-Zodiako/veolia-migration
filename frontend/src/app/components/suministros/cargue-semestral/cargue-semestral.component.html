<section>
  <div class="card-section">
    <div class="parametros-row">
      <app-aps-selector [selectedAps]="aps()" (selectedApsChange)="onApsChange($event)" label="APS"></app-aps-selector>
      <app-anno-selector [selectedAnno]="anno()" (selectedAnnoChange)="onAnnoChange($event)" label="Año"></app-anno-selector>
      <div class="form-group semestre-group">
        <label>Semestre</label>
        <p-select
          [options]="semestres"
          [ngModel]="semestre()"
          (ngModelChange)="onSemestreChange($event)"
          optionLabel="label"
          optionValue="value"
          placeholder="Seleccione semestre"
          [showClear]="true"
          styleClass="w-full">
        </p-select>
      </div>
    </div>
  </div>

  <div class="card-section flex gap-2 align-items-center">
    <button
      pButton
      label="CERTIFICAR"
      severity="warn"
      icon="pi pi-check"
      [loading]="certificando()"
      [disabled]="!filtrosValidos() || tarifasExistentes() !== false"
      (click)="certificar()">
    </button>
  </div>

  <p-message *ngIf="estado()" severity="info" [text]="estado()" styleClass="w-full mb-3"></p-message>
  <p-message *ngIf="error()" severity="error" [text]="error()" styleClass="w-full mb-3"></p-message>

  <div class="card-section" *ngIf="verificando()">
    <p class="loading-text">Verificando tarifas existentes...</p>
  </div>

  <div class="card-section" *ngIf="filtrosValidos() && tarifasExistentes() === true">
    <p-message severity="warn" text="Ya existen tarifas calculadas para el APS y período seleccionado."></p-message>
  </div>

  <div class="card-section" *ngIf="!filtrosValidos()">
    <p-message severity="warn" text="Debe seleccionar una APS, año y semestre primero."></p-message>
  </div>

  <div *ngIf="mostrarTabs()">
    <p-tabs [value]="currentTab()" (valueChange)="onTabChange($event)">
      <p-tablist>
        <p-tab value="PROPIA">Inf. Propia</p-tab>
        <p-tab value="COMPETIDOR">Inf. Competidor</p-tab>
        <p-tab value="USUARIOS">Inf. Usuarios</p-tab>
        <p-tab value="RURAL" *ngIf="rellenoExiste()">Inf. Rural</p-tab>
      </p-tablist>
      <p-tabpanels>
        <p-tabpanel value="PROPIA">
          <app-inf-propia-sem [aps]="aps()!" [anno]="anno()!" [semestre]="semestre()!" (guardado)="onGuardadoHijo()"></app-inf-propia-sem>
        </p-tabpanel>
        <p-tabpanel value="COMPETIDOR">
          <app-inf-competidor-sem [aps]="aps()!" [anno]="anno()!" [semestre]="semestre()!" (guardado)="onGuardadoHijo()"></app-inf-competidor-sem>
        </p-tabpanel>
        <p-tabpanel value="USUARIOS">
          <app-cargue-comercial-sem [aps]="aps()!" [anno]="anno()!" [semestre]="semestre()!" (guardado)="onGuardadoHijo()"></app-cargue-comercial-sem>
        </p-tabpanel>
        <p-tabpanel value="RURAL" *ngIf="rellenoExiste()">
          <app-inf-rural [aps]="aps()!" [anno]="anno()!" [semestre]="semestre()!" (guardado)="onGuardadoHijo()"></app-inf-rural>
        </p-tabpanel>
      </p-tabpanels>
    </p-tabs>
  </div>
</section>

<p-dialog header="Resultado Certificación Semestral" [visible]="mostrarModal()" [closable]="false" [modal]="true" [style]="{ 'max-width': '480px' }">
  <p-table [value]="datosModal()">
    <ng-template pTemplate="header">
      <tr><th>Barridos</th><th>Valor</th><th>Pgris</th></tr>
    </ng-template>
    <ng-template pTemplate="body" let-row>
      <tr>
        <td>{{ row.variable }}</td>
        <td [ngClass]="claseCelda(row.color)">{{ row.valor }}</td>
        <td class="celda-pgirs">{{ row.pgris }}</td>
      </tr>
    </ng-template>
  </p-table>
  <div class="modal-footer">
    <button pButton label="Cerrar" severity="secondary" (click)="cerrarModal()"></button>
  </div>
</p-dialog>

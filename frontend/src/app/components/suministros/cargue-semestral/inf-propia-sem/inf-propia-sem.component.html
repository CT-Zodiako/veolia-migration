<div class="card-section">
  <div class="form-group">
    <label>Empresa</label>
    <p-select
      [options]="empresas()"
      [ngModel]="empresaSeleccionada()"
      (ngModelChange)="empresaSeleccionada.set($event)"
      optionLabel="EMPR_NOMBRE"
      optionValue="EMPR_EMPR"
      placeholder="Seleccione empresa"
      [showClear]="true"
      styleClass="w-full">
    </p-select>
  </div>

  <p-message *ngIf="estado()" severity="info" [text]="estado()" styleClass="w-full mb-3 mt-3"></p-message>

  <app-cargue-archivo-pasos
    titulo="Cargue de Información Propia Semestral"
    [planoGuiaUrl]="planoGuiaUrl"
    [planoGuiaMeta]="planoGuiaMeta"
    accept=".csv"
    [disabled]="empresaSeleccionada() === null"
    disabledMessage="Seleccioná una empresa primero"
    [periodoDestino]="periodoDestino"
    [estado]="estadoCargue()"
    [errores]="erroresCargue()"
    [resumen]="resumenCargue()"
    guardarLabel="Guardar Información Propia"
    (archivoSeleccionado)="onArchivoSeleccionado($event)"
    (archivoQuitado)="cancelarCargue()"
    (cancelar)="cancelarCargue()"
    (guardar)="guardar()">
  </app-cargue-archivo-pasos>

  <div *ngIf="filas().length" class="preview">
    <h4>Vista Previa</h4>
    <app-tabla-avanzada
      [columnas]="columnasPreview"
      [rows]="filas()"
      [autoWidth]="true"
      storageKey="cargue-semestral-inf-propia"
      nombreExportar="Inf_Propia_Semestral">
    </app-tabla-avanzada>
  </div>
</div>

<p-toast></p-toast>

<div class="card-section">
    <app-parametros-consulta
      [wrapInCard]="false"
      [mostrarBoton]="false"
      [autoConsultar]="true"
      [aps]="aps()"
      (apsChange)="aps.set($event)"
      [anno]="anno()"
      (annoChange)="anno.set($event)"
      [mes]="mes()"
      (mesChange)="mes.set($event)"
      [loading]="consultaLoading()"
      (consultar)="consultar()"
    ></app-parametros-consulta>
  </div>

  <div class="card-section">
    <div class="mb-3 flex justify-content-end">
      <!-- Legacy tableVariablesPGRIS.vue:17-18,261-265: deshabilitado si el período ya tiene variables. -->
      <p-button
        label="Nuevo"
        icon="pi pi-plus-circle"
        severity="success"
        [disabled]="consultaData().length > 0"
        (onClick)="abrirNuevaVariable()"
      ></p-button>
    </div>

    <div *ngIf="consultaLoading()" class="text-center py-4">
      <i class="pi pi-spin pi-spinner" style="font-size: 2rem"></i>
      <p>Cargando...</p>
    </div>

    <div *ngIf="consultaError()" class="p-error p-3">
      <i class="pi pi-exclamation-circle"></i> {{ consultaError() }}
    </div>

    <div
      *ngIf="
        !consultaLoading() &&
        !consultaError() &&
        consultaData().length === 0
      "
      class="text-center py-4 text-secondary"
    >
      <i class="pi pi-inbox" style="font-size: 2rem"></i>
      <p>Sin datos</p>
    </div>

    <app-tabla-avanzada
      *ngIf="consultaData().length > 0"
      [columnas]="columnasVariables"
      [rows]="consultaData()"
      storageKey="pgirs-variables"
      nombreExportar="VariablesPGIRS"
      [cellTemplate]="celda"
      [accionesTemplate]="acciones"
      [cellClass]="cellClassVariables"
      [loading]="consultaLoading()"
      [filasPorPagina]="15"
      [rowsPerPageOptionsList]="[15, 30, 50, 100]"
    ></app-tabla-avanzada>

    <ng-template #celda let-value let-row="row" let-col="col">
      <ng-container [ngSwitch]="col.field">
        <span *ngSwitchCase="'PGRIVARIABLE'">{{ traducirVariable(value) }}</span>
        <span *ngSwitchCase="'MESREAL'">{{ nombreMes(value) }}</span>
        <span *ngSwitchCase="'PGRIFECHA'">{{ fechaIngreso(value) }}</span>

        <ng-container *ngSwitchCase="'PGRIVALOR'">
          <input
            *ngIf="editingKey() === rowKey(row); else valorReadonly"
            pInputText
            type="number"
            class="w-full text-right"
            [ngModel]="editingValor()"
            (ngModelChange)="editingValor.set($event)"
          />
          <ng-template #valorReadonly>{{ value ?? 0 }}</ng-template>
        </ng-container>

        <ng-container *ngSwitchCase="'PGRIFRECUENCIA'">
          <p-select
            *ngIf="editingKey() === rowKey(row); else frecuenciaReadonly"
            [options]="frecuenciaOptions"
            optionLabel="label"
            optionValue="value"
            [ngModel]="editingFrecuencia()"
            (ngModelChange)="editingFrecuencia.set($event)"
            styleClass="w-full"
          ></p-select>
          <ng-template #frecuenciaReadonly>{{ traducirFrecuencia(value) }}</ng-template>
        </ng-container>

        <span *ngSwitchDefault>{{ value ?? '' }}</span>
      </ng-container>
    </ng-template>

    <ng-template #acciones let-row>
      <div class="actions-cell">
        <ng-container *ngIf="editingKey() === rowKey(row); else accionEditar">
          <p-button icon="pi pi-check" severity="success" size="small" (onClick)="guardarFila(row)"></p-button>
          <p-button icon="pi pi-times" severity="secondary" size="small" (onClick)="cancelarEdicionFila()"></p-button>
        </ng-container>
        <ng-template #accionEditar>
          <p-button icon="pi pi-pencil" severity="info" size="small" (onClick)="iniciarEdicionFila(row)"></p-button>
        </ng-template>
      </div>
    </ng-template>

    <!-- Legacy tableVariablesPGRIS.vue:83-196: las siete variables (Barridos / CLUS) con su frecuencia. -->
    <p-dialog
      header="Nuevo variablesPGRIS"
      [modal]="true"
      [closable]="false"
      [style]="{ width: '36rem' }"
      [visible]="newDialogVisible()"
      (visibleChange)="newDialogVisible.set($event)"
    >
      <ng-container *ngFor="let seccion of seccionesNuevo">
        <h4>{{ seccion.titulo }}</h4>
        <div class="grid" *ngFor="let v of seccion.variables">
          <div class="col-12"><label class="block mb-1" [attr.for]="v.valorKey">{{ v.etiqueta }}</label></div>
          <div class="col-12 md:col-6">
            <input
              pInputText
              type="number"
              class="w-full"
              [id]="v.valorKey"
              [ngModel]="newForm()[v.valorKey]"
              (ngModelChange)="actualizarNuevo(v.valorKey, $event)"
            />
          </div>
          <div class="col-12 md:col-6">
            <p-select
              [options]="frecuenciaOptions"
              optionLabel="label"
              optionValue="value"
              placeholder="Frecuencia"
              [ngModel]="newForm()[v.frecuenciaKey]"
              (ngModelChange)="actualizarNuevo(v.frecuenciaKey, $event)"
              styleClass="w-full"
            ></p-select>
          </div>
          <div class="col-12 p-error" *ngIf="newFormError()">{{ newFormError() }}</div>
        </div>
      </ng-container>
      <div class="flex justify-content-end gap-2 mt-2">
        <p-button label="Cerrar" severity="secondary" (onClick)="newDialogVisible.set(false)"></p-button>
        <p-button label="Guardar" (onClick)="guardarNuevaVariable()"></p-button>
      </div>
    </p-dialog>
  </div>

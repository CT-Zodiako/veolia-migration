<section>
  <h2>APS Empresa</h2>

  <p *ngIf="loading">Cargando...</p>
  <p *ngIf="error" class="error">{{ error }}</p>

  <div class="table-wrapper" *ngIf="!loading && !error">
    <p-table #dt [value]="filteredRows" [columns]="columns" [tableStyle]="{ 'min-width': '50rem' }" [paginator]="true"
      [rows]="24" [rowsPerPageOptions]="[10, 24, 50]" [showGridlines]="true" size="small" exportFilename="download">
      <ng-template pTemplate="caption">
        <p-button icon="pi pi-external-link" size="small" [disabled]="!filteredRows.length" title="Exportar CSV"
          ariaLabel="Exportar CSV" (onClick)="dt.exportCSV()" />
      </ng-template>
      <ng-template pTemplate="header" let-columns>
        <tr>
          <th *ngFor="let col of columns" [pSortableColumn]="col.field">{{ col.header }} <p-sortIcon [field]="col.field" /></th>
        </tr>
        <tr>
          <th *ngFor="let col of columns">
            <input *ngIf="filterFields.includes(col.field)" pInputText type="text" placeholder="Contiene"
              [attr.aria-label]="'Filtrar ' + col.header" [(ngModel)]="filters[col.field]" (ngModelChange)="applyFilters()" />
          </th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-row>
        <tr>
          <td class="num">{{ formatId(row.TCFG_APS_ID) }}</td>
          <td>{{ row.NOMAPS }}</td>
          <td>{{ row.NUAP }}</td>
          <td>{{ row.EMPRESA }}</td>
          <td>{{ row.CODSUI }}</td>
          <td>{{ row.DEPARTAMENTO }}</td>
          <td>{{ row.MUNICIPIO }}</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</section>

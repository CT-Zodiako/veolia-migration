<section>
  <div class="card-section">
    <div class="parametros-row">
      <app-anno-selector [selectedAnno]="anno()" (selectedAnnoChange)="onAnnoChange($event)" label="Año"></app-anno-selector>
      <app-mes-selector [selectedMes]="mes()" (selectedMesChange)="onMesChange($event)" label="Mes"></app-mes-selector>
    </div>
  </div>

  <div class="table-wrapper table-scroll">
    <app-tabla-avanzada
      [columnas]="columnas"
      [rows]="rows()"
      [cellClass]="cellClass"
      [cellTemplate]="celda"
      [loading]="loading()"
      storageKey="dashboard-gerencial"
      nombreExportar="DashboardGerencial"
    ></app-tabla-avanzada>
  </div>

  <ng-template #celda let-value let-col="col">
    <ng-container *ngIf="col.field === 'TARI_FECHACREACION'; else crudo">{{ formatearFecha(value) }}</ng-container>
    <ng-template #crudo>{{ value }}</ng-template>
  </ng-template>
</section>

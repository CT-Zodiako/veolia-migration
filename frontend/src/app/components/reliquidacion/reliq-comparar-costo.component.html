<div class="page-wrap">
  <p-card>
    <div class="toolbar">
      <div class="form-group reliq-field">
        <label>Reliquidación</label>
        <p-select
          [options]="reliquidaciones()"
          optionLabel="relqNombre"
          optionValue="relqId"
          [ngModel]="selectedReliq()"
          (ngModelChange)="selectedReliq.set($event)"
          placeholder="Seleccione reliquidación"
          [style]="{ width: '100%' }"
        />
      </div>

      <div class="boton-wrapper">
        <p-button label="Comparar costos" icon="pi pi-search" [disabled]="!selectedReliq()" [loading]="loading()" (onClick)="consultar()" />
      </div>
    </div>
  </p-card>

  <div class="card-section">
    <app-tabla-avanzada
      [columnas]="columnas"
      [rows]="rowsParaTabla()"
      [loading]="loading()"
      storageKey="reliq-comparar-costo"
      nombreExportar="CompararCostos"
    ></app-tabla-avanzada>
  </div>
</div>

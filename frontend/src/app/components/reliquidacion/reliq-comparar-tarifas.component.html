<div class="page-wrap">
  <p-card>
    <div class="toolbar">
      <div class="form-group reliq-field">
        <label>Reliquidación</label>
        <p-select
          [options]="reliquidaciones()"
          optionLabel="relqNombre"
          optionValue="relqId"
          [ngModel]="selectedReliq()"
          (ngModelChange)="selectedReliq.set($event)"
          placeholder="Seleccione reliquidación"
          [style]="{ width: '100%' }"
        />
      </div>

      <app-parametros-consulta
        [aps]="selectedAps()"
        (apsChange)="selectedAps.set($event)"
        [anno]="selectedAnno()"
        (annoChange)="selectedAnno.set($event)"
        [mes]="selectedMes()"
        (mesChange)="selectedMes.set($event)"
        [mostrarBoton]="false"
        [wrapInCard]="false"
      ></app-parametros-consulta>

      <div class="boton-wrapper">
        <p-button label="Comparar tarifas" icon="pi pi-search" [disabled]="!puedeConsultar()" [loading]="loading()" (onClick)="consultar()" />
      </div>
    </div>
  </p-card>

  <div class="card-section">
    <app-tabla-avanzada
      [columnas]="columnas"
      [rows]="rowsParaTabla()"
      storageKey="reliq-comparar-tarifas"
      nombreExportar="ComparaTarifas"
    ></app-tabla-avanzada>
  </div>

  <div class="card-section" *ngIf="resumenDataset().length > 0">
    <p-fieldset [legend]="resumenPeriodo() || 'Resumen por periodo'">
      <div class="resumen-grid">
        <div class="resumen-bloque" *ngFor="let item of resumenDataset()">
          <p-table [value]="filasDeResumen(item)" styleClass="p-datatable-sm" [scrollable]="true">
            <ng-template pTemplate="caption">{{ item.nombre }}</ng-template>
            <ng-template pTemplate="header">
              <tr>
                <th *ngFor="let columna of item.columns">{{ columna }}</th>
              </tr>
            </ng-template>
            <ng-template pTemplate="body" let-fila>
              <tr>
                <td *ngFor="let columna of item.columns">{{ fila[columna] }}</td>
              </tr>
            </ng-template>
            <ng-template pTemplate="emptymessage">
              <tr><td [attr.colspan]="item.columns.length || 1">Sin datos.</td></tr>
            </ng-template>
          </p-table>
        </div>
      </div>
    </p-fieldset>
  </div>
</div>

<p-toast></p-toast>

<div class="card-section">
  <div class="selector-grid">
    <div class="selector-col selector-col-filtros">
      <app-aps-selector
        label="APS"
        [selectedAps]="selectedAps()"
        (selectedApsChange)="onApsChange($event)"
      ></app-aps-selector>
      <div class="reliq-field">
        <label for="reliq-cargue-select">Reliquidación</label>
        <p-select
          inputId="reliq-cargue-select"
          [options]="reliquidaciones()"
          optionLabel="relqNombre"
          optionValue="relqId"
          [ngModel]="selectedReliq()"
          (ngModelChange)="onReliqChange($event)"
          placeholder="Seleccione reliquidación"
          [filter]="true"
          filterBy="relqNombre"
          [showClear]="true"
          appendTo="body"
          [style]="{ width: '100%' }"
        />
      </div>
    </div>

    <div class="selector-col selector-col-descripcion">
      <label for="reliq-cargue-descripcion">Descripción</label>
      <textarea
        id="reliq-cargue-descripcion"
        pTextarea
        rows="5"
        [value]="reliqSeleccionada()?.relqDescripcion || ''"
        readonly
        class="reliq-readonly"
      ></textarea>
    </div>

    <div class="selector-col selector-col-horizonte">
      <div class="horizonte-field">
        <label for="reliq-cargue-desde">Desde</label>
        <input
          id="reliq-cargue-desde"
          pInputText
          [value]="formatPeriodo(reliqSeleccionada()?.relqDesde)"
          readonly
          class="reliq-readonly"
        />
      </div>
      <div class="horizonte-field">
        <label for="reliq-cargue-hasta">Hasta</label>
        <input
          id="reliq-cargue-hasta"
          pInputText
          [value]="formatPeriodo(reliqSeleccionada()?.relqHasta)"
          readonly
          class="reliq-readonly"
        />
      </div>
    </div>

    <div class="boton-wrapper">
      <label class="label-spacer">&nbsp;</label>
      <div class="botones-row">
        <p-button
          label="Consultar"
          icon="pi pi-search"
          [loading]="loading()"
          [disabled]="!selectedReliq()"
          (onClick)="consultar()"
        />
        <p-button
          label="RELIQUIDAR TARIFA"
          icon="pi pi-refresh"
          severity="danger"
          [loading]="reliquidando()"
          [disabled]="!selectedReliq()"
          (onClick)="reliquidarTarifa()"
        />
      </div>
    </div>
  </div>
</div>

<div class="card-section">
  <ng-template #celda let-value let-row="row" let-col="col">
    <input
      *ngIf="esCampoEditable(col.field); else celdaTexto"
      pInputText
      type="number"
      class="cell-input"
      [ngModel]="row[col.field]"
      (ngModelChange)="row[col.field] = $event ?? 0"
    />
    <ng-template #celdaTexto>{{ valorCeldaTexto(row, col.field, value) }}</ng-template>
  </ng-template>

  <p-tabs [value]="currentTab()" (valueChange)="onTabChange($event)">
    <p-tablist>
      <p-tab value="usuarios">Usuarios</p-tab>
      <p-tab value="empresa">Empresa</p-tab>
      <p-tab value="aps">APS</p-tab>
      <p-tab value="relleno">Relleno</p-tab>
      <p-tab value="adicional">Adicional</p-tab>
    </p-tablist>
    <p-tabpanels>
      <!-- USUARIOS -->
      <p-tabpanel value="usuarios">
        <app-tabla-avanzada
          [columnas]="columnasUsuarios"
          [rows]="usuariosRows()"
          storageKey="reliq-cargue-usuarios"
          nombreExportar="ReliqCargueUsuarios"
          [cellTemplate]="celda"
          [loading]="loading()"
        ></app-tabla-avanzada>
        <p-button label="{{ guardando() ? 'Guardando...' : 'Guardar Usuarios' }}" [loading]="guardando()" class="mt-2" (onClick)="guardar('usuarios')" />
      </p-tabpanel>

      <!-- EMPRESA -->
      <p-tabpanel value="empresa">
        <app-tabla-avanzada
          [columnas]="columnasEmpresa"
          [rows]="empresaRows()"
          storageKey="reliq-cargue-empresa"
          nombreExportar="ReliqCargueEmpresa"
          [cellTemplate]="celda"
          [loading]="loading()"
        ></app-tabla-avanzada>
        <p-button label="{{ guardando() ? 'Guardando...' : 'Guardar Empresa' }}" [loading]="guardando()" class="mt-2" (onClick)="guardar('empresa')" />
      </p-tabpanel>

      <!-- APS -->
      <p-tabpanel value="aps">
        <app-tabla-avanzada
          [columnas]="columnasAps"
          [rows]="apsRows()"
          storageKey="reliq-cargue-aps"
          nombreExportar="ReliqCargueAps"
          [cellTemplate]="celda"
          [loading]="loading()"
        ></app-tabla-avanzada>
        <p-button label="{{ guardando() ? 'Guardando...' : 'Guardar APS' }}" [loading]="guardando()" class="mt-2" (onClick)="guardar('aps')" />
      </p-tabpanel>

      <!-- RELLENO -->
      <p-tabpanel value="relleno">
        <app-tabla-avanzada
          [columnas]="columnasRelleno"
          [rows]="rellenoRows()"
          storageKey="reliq-cargue-relleno"
          nombreExportar="ReliqCargueRelleno"
          [cellTemplate]="celda"
          [loading]="loading()"
        ></app-tabla-avanzada>
        <p-button label="{{ guardando() ? 'Guardando...' : 'Guardar Relleno' }}" [loading]="guardando()" class="mt-2" (onClick)="guardar('relleno')" />
      </p-tabpanel>

      <!-- ADICIONAL -->
      <p-tabpanel value="adicional">
        <app-tabla-avanzada
          [columnas]="columnasAdicional"
          [rows]="adicionalRows()"
          storageKey="reliq-cargue-adicional"
          nombreExportar="ReliqCargueAdicional"
          [cellTemplate]="celda"
          [loading]="loading()"
        ></app-tabla-avanzada>
        <p-button label="{{ guardando() ? 'Guardando...' : 'Guardar Adicional' }}" [loading]="guardando()" class="mt-2" (onClick)="guardar('adicional')" />
      </p-tabpanel>
    </p-tabpanels>
  </p-tabs>
</div>

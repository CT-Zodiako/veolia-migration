<div class="card-section">
  <div class="flex justify-content-end">
    <p-button label="Nueva reliquidación" icon="pi pi-plus" (onClick)="nueva()" />
  </div>
</div>

<div class="card-section">
  <p-table [value]="reliquidaciones()" [loading]="loading()" styleClass="p-datatable-sm" [tableStyle]="{ 'min-width': '100%' }">
    <ng-template pTemplate="header">
      <tr>
        <th>ID</th><th>APS</th><th>Nombre</th><th>Descripción</th><th>Periodo</th><th>Estado</th><th>Acciones</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-row>
      <tr>
        <td>{{ row.relqId }}</td>
        <td>{{ row.apsaId }}</td>
        <td>{{ row.relqNombre }}</td>
        <td>{{ row.relqDescripcion }}</td>
        <td>{{ row.relqDesde }} - {{ row.relqHasta }}</td>
        <td>{{ row.relqEstado }}</td>
        <td class="actions-cell">
          <p-button icon="pi pi-pencil" severity="info" size="small" (onClick)="editar(row)"></p-button>
          <p-button icon="pi pi-trash" severity="danger" size="small" (onClick)="eliminar(row)"></p-button>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-dialog [visible]="showDialog()" header="Reliquidación" [modal]="true" [style]="{width:'50rem'}" (visibleChange)="showDialog.set($event)">
  @if (error()) {
    <div class="error-message">{{ error() }}</div>
  }
  <form [formGroup]="form" class="form-grid">
    <label>APS</label>
    <p-select formControlName="apsaId" [options]="apsOptions()" optionLabel="apsaNombre" optionValue="apsaId" placeholder="Seleccione APS" />
    <label>Nombre</label>
    <input pInputText formControlName="nombre" />
    <label>Descripción</label>
    <textarea pTextarea rows="2" formControlName="descripcion"></textarea>
    <label>Periodo desde (YYYYMM)</label>
    <input pInputText formControlName="desde" />
    <label>Periodo hasta (YYYYMM)</label>
    <input pInputText formControlName="hasta" />
    <label>Solicitante</label>
    <p-select formControlName="usuSolicita" [options]="usuariosAps()" optionLabel="SISU_CORREO" optionValue="SISU_ID" [filter]="true" filterPlaceholder="Buscar usuario..." placeholder="Seleccione usuario" />
    <label>Estado</label>
    <p-select formControlName="estado" [options]="estadoOptions" optionLabel="label" optionValue="value" />
    <label>Aprobador</label>
    <p-select formControlName="usuAprueba" [options]="usuariosAps()" optionLabel="SISU_CORREO" optionValue="SISU_ID" [filter]="true" filterPlaceholder="Buscar usuario..." placeholder="Seleccione usuario" />
  </form>
  <ng-template pTemplate="footer">
    <p-button label="Cancelar" severity="secondary" (onClick)="showDialog.set(false)" />
    <p-button label="Guardar" icon="pi pi-save" [loading]="saving()" (onClick)="guardar()" />
  </ng-template>
</p-dialog>

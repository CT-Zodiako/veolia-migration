<div class="inicio" [class.con-panel]="mostrarPersonalizar">
  <div class="inicio-main">
    <section class="accesos">
      <div class="accesos-header">
        <div>
          <h2>Mis accesos</h2>
          <p>Las páginas que más usa, a un clic</p>
        </div>
        <button type="button" class="btn-outline" (click)="mostrarPersonalizar = true">
          <i class="pi pi-sliders-h"></i>
          Personalizar
        </button>
      </div>

      <div class="cards-grid" cdkDropList cdkDropListOrientation="mixed" (cdkDropListDropped)="onDrop($event)">
        <a
          *ngFor="let card of cards; trackBy: trackByRoute"
          [routerLink]="card.route"
          class="card"
          cdkDrag
          cdkDragBoundary=".cards-grid"
        >
          <div class="card-drag-placeholder" *cdkDragPlaceholder></div>
          <div class="card-icon"><i [class]="card.lineIcon"></i></div>
          <div class="card-texto">
            <h3>{{ card.title }}</h3>
            <span class="card-grupo">{{ card.grupo }}</span>
          </div>
        </a>

        <button type="button" class="card-agregar" (click)="mostrarPersonalizar = true">
          <span class="card-agregar-icono"><i class="pi pi-plus"></i></span>
          Agregar acceso
        </button>

        <p *ngIf="cards.length === 0" class="sin-accesos">
          No elegiste ningún acceso todavía. Tocá "Personalizar" para agregar los que quieras ver acá.
        </p>
      </div>
    </section>

    <section class="help-cta">
      <div class="help-cta-info">
        <div class="help-cta-icon">
          <i class="pi pi-question-circle"></i>
        </div>
        <div>
          <h4>¿Necesitas ayuda con algo más?</h4>
          <p>Explorá nuestra base de conocimientos o contactá a soporte.</p>
        </div>
      </div>
      <div class="help-cta-actions">
        <button type="button" class="btn-outline" (click)="ayudaService.abrirDocumentacion()">Ver Documentación</button>
      </div>
    </section>
  </div>

  <app-personalizar-inicio-dialog
    *ngIf="mostrarPersonalizar"
    class="personalizar-panel"
    [visible]="mostrarPersonalizar"
    (visibleChange)="mostrarPersonalizar = $event"
    [disponibles]="disponibles"
    [seleccionadosIniciales]="cardPaths"
    (guardar)="guardarSeleccion($event)"
  ></app-personalizar-inicio-dialog>
</div>

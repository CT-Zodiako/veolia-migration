<div class="dashboard-container">
  <div class="dashboard-header">
    <p-button
      class="btn-personalizar"
      icon="pi pi-cog"
      label="Personalizar"
      severity="secondary"
      [text]="true"
      (click)="mostrarPersonalizar = true"
    ></p-button>
  </div>

  <div class="help-cta">
    <div class="help-cta-info">
      <div class="help-cta-icon">
        <app-icon name="life-buoy" [size]="32"></app-icon>
      </div>
      <div>
        <h4>¿Necesitas ayuda con algo más?</h4>
        <p>Explorá nuestra base de conocimientos o contactá a soporte.</p>
      </div>
    </div>
    <div class="help-cta-actions">
      <p-button label="Ver Documentación" severity="secondary" [outlined]="true" (click)="ayudaService.abrirDocumentacion()"></p-button>
      <p-button label="Soporte Directo" (click)="ayudaService.abrirMenuSoporte($event)"></p-button>
    </div>
  </div>

  <div
    class="cards-grid"
    [style.grid-template-columns]="'repeat(' + columnas + ', 1fr)'"
    cdkDropList
    cdkDropListOrientation="mixed"
    (cdkDropListDropped)="onDrop($event)"
  >
    <a
      *ngFor="let card of cards; trackBy: trackByRoute"
      [routerLink]="card.route"
      class="card"
      cdkDrag
      cdkDragBoundary=".cards-grid"
    >
      <div class="card-drag-placeholder" *cdkDragPlaceholder></div>
      <div class="card-icon">
        <img
          *ngIf="card.iconoCustomUrl; else iconoTwemoji"
          [src]="card.iconoCustomUrl"
          [alt]="card.title"
          class="card-icon-custom"
        />
        <ng-template #iconoTwemoji>
          <app-icon [name]="card.icon" [size]="40"></app-icon>
        </ng-template>
      </div>
      <h3>{{ card.title }}</h3>
    </a>

    <p *ngIf="cards.length === 0" class="sin-accesos">
      No elegiste ningún acceso todavía. Tocá "Personalizar" para agregar los que quieras ver acá.
    </p>
  </div>
</div>

<app-personalizar-inicio-dialog
  [(visible)]="mostrarPersonalizar"
  [disponibles]="disponibles"
  [seleccionadosIniciales]="cardPaths"
  [columnas]="columnas"
  (guardar)="guardarSeleccion($event)"
  (columnasChange)="guardarColumnas($event)"
></app-personalizar-inicio-dialog>

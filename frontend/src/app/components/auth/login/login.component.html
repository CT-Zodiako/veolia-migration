<div class="login-container">
  <div class="login-box">
    <div class="login-header">
      <img src="/VeoliaLogo.png" alt="Veolia" class="login-logo" />
    </div>

    <div *ngIf="error" class="error-message">
      {{ error }}
    </div>

    <form (ngSubmit)="login()">
      <div class="form-group">
        <label>Correo electrónico</label>
        <input
          pInputText
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="usuario@veolia.com"
          (ngModelChange)="onCredentialsChange()"
          [disabled]="loading"
          required
          style="width: 100%"
        />
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <input
          pInputText
          type="password"
          [(ngModel)]="password"
          name="password"
          (ngModelChange)="onPasswordChange()"
          [disabled]="loading"
          placeholder="••••••••"
          required
          style="width: 100%"
        />
      </div>

      <p *ngIf="validating" role="status" aria-live="polite">Validando credenciales...</p>

      <p-button
        type="submit"
        [label]="credentialsValidated ? 'Seleccionar sistema' : 'Ingresar'"
        [loading]="loading || validating"
        [disabled]="loading || validating || !credentialsValidated || !sistemas.length"
        styleClass="w-full"
      ></p-button>
    </form>

    <p-dialog
      [(visible)]="showSistemaDialog"
      header="Seleccioná el sistema"
      [modal]="true"
      [closable]="false"
      [draggable]="false"
      [style]="{ width: 'min(92vw, 28rem)' }"
    >
      <p class="dialog-description">Tus credenciales son correctas. Elegí el sistema con el que querés ingresar.</p>
      <div class="form-group">
        <label for="login-sistema">Sistema</label>
        <p-select
          inputId="login-sistema"
          [options]="sistemas"
          [(ngModel)]="idSistema"
          name="sistemaDialog"
          optionLabel="SIST_NOMBRE"
          optionValue="SIST_ID"
          placeholder="Seleccione un sistema"
          [style]="{width: '100%'}"
        ></p-select>
      </div>
      <ng-template pTemplate="footer">
        <p-button
          label="Continuar"
          icon="pi pi-arrow-right"
          [loading]="loading"
          [disabled]="loading || !idSistema"
          (onClick)="login()"
        ></p-button>
      </ng-template>
    </p-dialog>
  </div>
</div>

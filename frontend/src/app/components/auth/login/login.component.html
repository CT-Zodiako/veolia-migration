<div class="login-container">
  <div class="login-box">
    <div class="login-header">
      <img src="/VeoliaLogo.png" alt="Veolia" class="login-logo" />
    </div>

    <div *ngIf="error" class="error-message">
      {{ error }}
    </div>

    <form (ngSubmit)="validateCredentials()">
      <div class="form-group">
        <label>Correo electrónico</label>
        <input
          pInputText
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="usuario@veolia.com"
          (ngModelChange)="onCredentialsChange()"
          [disabled]="loading"
          required
          style="width: 100%"
        />
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <input
          pInputText
          type="password"
          [(ngModel)]="password"
          name="password"
          (ngModelChange)="onPasswordChange()"
          [disabled]="loading"
          placeholder="••••••••"
          required
          style="width: 100%"
        />
      </div>

      <p *ngIf="validating" role="status" aria-live="polite">Validando credenciales...</p>

      <p-button
        type="submit"
        label="Ingresar"
        [loading]="loading || validating"
        [disabled]="loading || validating"
        styleClass="w-full"
      ></p-button>
    </form>

    <p-dialog
      [(visible)]="showSistemaDialog"
      header="Seleccioná el sistema"
      [modal]="true"
      [closable]="false"
      [draggable]="false"
      [style]="{ width: 'min(92vw, 28rem)' }"
    >
      <p class="dialog-description">Tus credenciales son correctas. Elegí el sistema al que querés ingresar.</p>
      <div class="system-options" role="list" aria-label="Sistemas disponibles">
        <p-button
          *ngFor="let sistema of sistemas"
          [label]="sistema.SIST_NOMBRE"
          icon="pi pi-arrow-right"
          [loading]="loading && idSistema === sistema.SIST_ID"
          [disabled]="loading"
          styleClass="system-option"
          (onClick)="selectSistema(sistema.SIST_ID)"
        ></p-button>
      </div>
    </p-dialog>
  </div>
</div>

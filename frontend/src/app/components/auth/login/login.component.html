<div class="login-container">
  <div class="login-box">
    <div class="login-header">
      <img src="/VeoliaLogo.png" alt="Veolia" class="login-logo" />
    </div>

    <div *ngIf="error" class="error-message">
      {{ error }}
    </div>

    <form (ngSubmit)="login()">
      <div class="form-group">
        <label>Correo electrónico</label>
        <input
          pInputText
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="usuario@veolia.com"
          (ngModelChange)="onCredentialsChange()"
          [disabled]="loading"
          required
          style="width: 100%"
        />
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <input
          pInputText
          type="password"
          [(ngModel)]="password"
          name="password"
          (ngModelChange)="onCredentialsChange()"
          (blur)="validateCredentials()"
          [disabled]="loading"
          placeholder="••••••••"
          required
          style="width: 100%"
        />
      </div>

      <p *ngIf="validating" role="status" aria-live="polite">Validando credenciales...</p>

      <div class="form-group" *ngIf="credentialsValidated && sistemas.length > 0">
        <label>Sistema</label>
        <p-select
          [options]="sistemas"
          [disabled]="loading || validating || !credentialsValidated"
          [(ngModel)]="idSistema"
          name="sistema"
          optionLabel="SIST_NOMBRE"
          optionValue="SIST_ID"
          placeholder="Seleccione un sistema"
          appendTo="body"
          [style]="{width: '100%'}"
        ></p-select>
      </div>

      <p-button
        type="submit"
        label="{{ loading ? 'Ingresando...' : 'Ingresar' }}"
        [loading]="loading"
        [disabled]="loading || validating || !credentialsValidated || !idSistema"
        styleClass="w-full"
      ></p-button>
    </form>
  </div>
</div>

<p-card>
  <p-table
    [value]="filteredRows"
    [loading]="loading"
    [paginator]="true"
    [rows]="10"
    [rowsPerPageOptions]="[10, 20, 50]"
    [tableStyle]="{ 'min-width': '100%' }"
  >
    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="APSA_NOMAPS">APS <p-sortIcon field="APSA_NOMAPS"></p-sortIcon></th>
        <th pSortableColumn="AUTO_ANNO">Año <p-sortIcon field="AUTO_ANNO"></p-sortIcon></th>
        <th pSortableColumn="AUTO_MES">Mes <p-sortIcon field="AUTO_MES"></p-sortIcon></th>
        <th pSortableColumn="AUTO_DESCRIPCION">Descripción <p-sortIcon field="AUTO_DESCRIPCION"></p-sortIcon></th>
        <th pSortableColumn="AUTO_FECCREA">Fecha creación <p-sortIcon field="AUTO_FECCREA"></p-sortIcon></th>
        <th pSortableColumn="SISU_CORREO">Usuario <p-sortIcon field="SISU_CORREO"></p-sortIcon></th>
      </tr>
      <tr class="filter-row">
        <th>
          <input pInputText type="text" class="column-filter-input" placeholder="Buscar"
            (input)="apsFilter = $any($event.target).value" />
        </th>
        <th>
          <input pInputText type="text" class="column-filter-input" placeholder="Buscar"
            (input)="annoFilter = $any($event.target).value" />
        </th>
        <th>
          <input pInputText type="text" class="column-filter-input" placeholder="Buscar"
            (input)="mesFilter = $any($event.target).value" />
        </th>
        <th></th>
        <th>
          <input pInputText type="text" class="column-filter-input" placeholder="Buscar"
            (input)="fechaFilter = $any($event.target).value" />
        </th>
        <th>
          <input pInputText type="text" class="column-filter-input" placeholder="Buscar"
            (input)="usuarioFilter = $any($event.target).value" />
        </th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-row>
      <tr>
        <td>{{ row['APSA_NOMAPS'] }}</td>
        <td>{{ row['AUTO_ANNO'] }}</td>
        <td>{{ row['AUTO_MES'] }}</td>
        <td>{{ row['AUTO_DESCRIPCION'] }}</td>
        <td>{{ row['AUTO_FECCREA'] | date: 'dd/MM/yyyy' }}</td>
        <td>{{ row['SISU_CORREO'] }}</td>
      </tr>
    </ng-template>
  </p-table>

  <p *ngIf="error" style="color: var(--color-brand-accent); margin-top: 12px;">{{ error }}</p>
</p-card>

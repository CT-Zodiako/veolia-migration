<div *ngIf="loading" class="text-center py-4">
  <i class="pi pi-spin pi-spinner" style="font-size: 2rem"></i>
  <p>Cargando...</p>
</div>

<div *ngIf="!loading && (!data || data.data.length === 0)" class="text-center py-4 text-secondary">
  <i class="pi pi-inbox" style="font-size: 2rem"></i>
  <p>Sin datos</p>
</div>

<div *ngIf="!loading && data && data.data.length > 0" class="table-scroll">
  <h4 class="formato2-titulo" *ngIf="data.title">{{ data.title }}</h4>
  <app-tabla-avanzada
    [columnas]="columnas"
    [rows]="data.data"
    [columnasFijadasPorDefecto]="columnasFijadasPorDefecto"
    [storageKey]="storageKey"
    [nombreExportar]="nombreExportarEfectivo"
    [cellTemplate]="celdaTpl"
    [cellClass]="cellClassFn"
    [accionesTemplate]="accionesTpl"
    accionesPosicion="inicio"
  ></app-tabla-avanzada>
</div>

<ng-template #celdaTpl let-value let-col="col">
  <span [title]="tooltip(col, value)">{{ displayValue(col, value) }}</span>
</ng-template>

<ng-template #accionesTpl let-row>
  <p-button
    icon="pi pi-eye"
    label="Ver"
    size="small"
    [outlined]="true"
    [rounded]="true"
    styleClass="sui853-ver-btn"
    (click)="verDetalle(row)"
  ></p-button>
</ng-template>

<div class="modal-overlay" *ngIf="detalleVisible" (click)="cerrarDetalle()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3><span class="modal-header-icon"><i class="pi pi-eye"></i></span> Detalle</h3>
      <p-button icon="pi pi-times" [rounded]="true" [text]="true" severity="secondary" (click)="cerrarDetalle()"></p-button>
    </div>
    <p class="formato2-titulo modal-titulo" *ngIf="data?.title">{{ data?.title }}</p>
    <p class="modal-hint">Hacé clic en cualquier valor para copiarlo.</p>

    <div class="detail-grid">
      <div
        class="detail-item"
        *ngFor="let entry of detalleEntries"
        [class.copiable]="entry.value"
        [title]="entry.value ? 'Copiar: ' + entry.value : ''"
        (click)="copiarValor(entry)"
      >
        <div class="detail-key">{{ entry.label }}</div>
        <div class="detail-value">
          <span>{{ entry.value || '—' }}</span>
          <i class="pi pi-copy detail-copy-icon" *ngIf="entry.value"></i>
        </div>
        <span class="detail-copied" *ngIf="copiedLabel === entry.label"><i class="pi pi-check"></i> Copiado: {{ entry.value }}</span>
      </div>
    </div>
  </div>
</div>

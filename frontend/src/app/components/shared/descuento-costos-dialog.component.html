<p-dialog
  [header]="esNuevo() ? 'Nuevo descuento' : 'Editar descuento'"
  [modal]="true"
  [closable]="true"
  [style]="{ width: '30rem' }"
  [visible]="visible()"
  (visibleChange)="visible.set($event)"
>
  <div class="form-group">
    <label>Descuento</label>
    <p-select
      [options]="catalogoOptions()"
      optionLabel="PARA_NOMBRE"
      optionValue="PARA_PARA"
      placeholder="Seleccionar descuento"
      [ngModel]="seleccion()"
      (ngModelChange)="seleccion.set($event)"
      [loading]="cargando()"
      [appendTo]="'body'"
      [filter]="true"
      filterBy="PARA_NOMBRE"
      styleClass="w-full"
    ></p-select>
  </div>

  <div class="form-group">
    <label>Valor</label>
    <p-inputNumber
      [ngModel]="valor()"
      (ngModelChange)="valor.set($event)"
      mode="decimal"
      [minFractionDigits]="0"
      [maxFractionDigits]="4"
      class="w-full"
    ></p-inputNumber>
  </div>

  <div class="flex justify-content-end gap-2 mt-3">
    <p-button label="Cancelar" severity="secondary" (onClick)="cerrar()"></p-button>
    <p-button label="Guardar" [loading]="guardando()" (onClick)="guardar()"></p-button>
  </div>
</p-dialog>

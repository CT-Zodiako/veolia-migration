<p-toast></p-toast>

<div class="card-section">
  <div class="filters">
    <app-anno-selector [selectedAnno]="anno()" (selectedAnnoChange)="onAnnoChange($event)" label="Año"></app-anno-selector>
    <app-mes-selector [selectedMes]="mes()" (selectedMesChange)="onMesChange($event)" label="Mes"></app-mes-selector>
  </div>
</div>

<div class="card-section">
  <div class="agregar-bar" *ngIf="!loading() && rows().length === 0">
    <p-button label="Agregar" icon="pi pi-plus" (click)="abrirModalAgregar()"></p-button>
  </div>

  <p-table [value]="rows()" [loading]="loading()" [tableStyle]="{ 'min-width': '30rem' }">
    <ng-template pTemplate="header">
      <tr>
        <th>Tipo Índice</th>
        <th class="text-right">Valor</th>
        <th>Acciones</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-row>
      <tr>
        <td>{{ nombreIndice(row.paraIndice20011) }}</td>
        <td class="text-right">
          <p-inputnumber
            *ngIf="editingParaId() === row.paraIndice20011; else valorReadonly"
            [ngModel]="editingValor()"
            (ngModelChange)="editingValor.set($event)"
            mode="decimal"
            [minFractionDigits]="0"
            [maxFractionDigits]="4"
          ></p-inputnumber>
          <ng-template #valorReadonly>{{ row.indiValor }}</ng-template>
        </td>
        <td class="actions">
          <ng-container *ngIf="editingParaId() === row.paraIndice20011; else accionEditar">
            <p-button icon="pi pi-check" severity="success" size="small" (click)="confirmarGuardar(row)"></p-button>
            <p-button icon="pi pi-times" severity="secondary" size="small" (click)="cancelarEdicion()"></p-button>
          </ng-container>
          <ng-template #accionEditar>
            <p-button icon="pi pi-pencil" severity="info" size="small" (click)="iniciarEdicion(row)"></p-button>
          </ng-template>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="3">No hay índices registrados para el período seleccionado.</td>
      </tr>
    </ng-template>
  </p-table>
</div>

<div class="modal-overlay" *ngIf="showModal()" (click)="cerrarModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>Registrar Nuevo Índice</h3>
      <p-button icon="pi pi-times" [rounded]="true" [text]="true" severity="secondary" (click)="cerrarModal()"></p-button>
    </div>

    <form (ngSubmit)="guardarNuevo()">
      <div class="form-group">
        <label>{{ nombreIndice(1) }}</label>
        <p-inputnumber [ngModel]="nuevoIpc()" (ngModelChange)="nuevoIpc.set($event)" name="ipc" mode="decimal" [minFractionDigits]="0" [maxFractionDigits]="4" styleClass="w-full"></p-inputnumber>
      </div>
      <div class="form-group">
        <label>{{ nombreIndice(2) }}</label>
        <p-inputnumber [ngModel]="nuevoSmlv()" (ngModelChange)="nuevoSmlv.set($event)" name="smlv" mode="decimal" [minFractionDigits]="0" [maxFractionDigits]="4" styleClass="w-full"></p-inputnumber>
      </div>
      <div class="form-group">
        <label>{{ nombreIndice(3) }}</label>
        <p-inputnumber [ngModel]="nuevoIpcc()" (ngModelChange)="nuevoIpcc.set($event)" name="ipcc" mode="decimal" [minFractionDigits]="0" [maxFractionDigits]="4" styleClass="w-full"></p-inputnumber>
      </div>
      <div class="form-group">
        <label>{{ nombreIndice(4) }}</label>
        <p-inputnumber [ngModel]="nuevoIoexp()" (ngModelChange)="nuevoIoexp.set($event)" name="ioexp" mode="decimal" [minFractionDigits]="0" [maxFractionDigits]="4" styleClass="w-full"></p-inputnumber>
      </div>

      <p-button type="submit" label="{{ guardandoNuevo() ? 'Guardando...' : 'Guardar' }}" [loading]="guardandoNuevo()" styleClass="w-full"></p-button>
    </form>
  </div>
</div>

<p-toast></p-toast>

<div class="card-section">
  <div class="filters">
    <app-aps-selector [selectedAps]="aps()" (selectedApsChange)="onApsChange($event)" label="APS"></app-aps-selector>
    <app-anno-selector [selectedAnno]="anno()" (selectedAnnoChange)="onAnnoChange($event)" label="Año"></app-anno-selector>
    <app-mes-selector [selectedMes]="mes()" (selectedMesChange)="onMesChange($event)" label="Mes"></app-mes-selector>
  </div>
</div>

<!-- Legacy SubCon.vue:14-54: stored rows only, with Agregar (no rows) or Editar (rows) next to the grid. -->
<div class="card-section subcon-layout">
  <p-table [value]="registros()" [loading]="loading()" [tableStyle]="{ 'min-width': '30rem' }">
    <ng-template pTemplate="header">
      <tr>
        <th>Clase de Uso</th>
        <th class="text-right">Valor</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-item>
      <tr>
        <td>{{ item.nombre }}</td>
        <td class="text-right">{{ item.valor }}</td>
      </tr>
    </ng-template>
  </p-table>

  <div class="actions" *ngIf="aps() && anno() && mes()">
    <p-button *ngIf="esNuevo(); else botonEditar" label="Agregar" icon="pi pi-plus" severity="success" (click)="abrirDialogo()"></p-button>
    <ng-template #botonEditar>
      <p-button label="Editar" icon="pi pi-pencil" severity="warn" (click)="abrirDialogo()"></p-button>
    </ng-template>
  </div>
</div>

<!-- Legacy SubCon.vue:61-212: one dialog with the nine clases; Guardar saves all of them in one request. -->
<p-dialog [header]="tituloDialogo()" [visible]="dialogVisible()" (visibleChange)="dialogVisible.set($event)" [modal]="true" [style]="{ width: '20vw', minWidth: '18rem' }">
  <div class="valor-editor" *ngFor="let c of clasesLegacy">
    <label [attr.for]="'subcon-' + c.clase">{{ c.nombre }}</label>
    <input
      pInputText
      [id]="'subcon-' + c.clase"
      type="number"
      step="any"
      inputmode="decimal"
      [ngModel]="valorDialogo(c.clase)"
      (ngModelChange)="onValorDialogoChange(c.clase, $event)"
    />
  </div>
  <ng-template pTemplate="footer">
    <p-button label="Guardar" icon="pi pi-check" (click)="confirmarGuardar()"></p-button>
    <p-button label="No" icon="pi pi-times" severity="secondary" (click)="cerrarDialogo()"></p-button>
  </ng-template>
</p-dialog>

<p-toast></p-toast>

<div class="card-section">
  <div class="filters">
    <app-aps-selector [selectedAps]="aps()" (selectedApsChange)="onApsChange($event)" label="APS"></app-aps-selector>
    <app-anno-selector [selectedAnno]="anno()" (selectedAnnoChange)="onAnnoChange($event)" label="Año"></app-anno-selector>
    <app-mes-selector [selectedMes]="mes()" (selectedMesChange)="onMesChange($event)" label="Mes"></app-mes-selector>
  </div>
</div>

<!-- Legacy SubCon.vue:14-54 (stored rows, Agregar or Editar). design/suministros-pantallas/17-subcon-c-actual-mejorada.html:
     action in the card header, real percentages with their label, groups and a footer summary. -->
<section class="card-section subcon-card" aria-label="Porcentajes por clase de uso">
  <header class="subcon-header">
    <div class="actions" *ngIf="aps() && anno() && mes()">
      <p-button *ngIf="esNuevo(); else botonEditar" label="Agregar" icon="pi pi-plus" (click)="abrirDialogo()"></p-button>
      <ng-template #botonEditar>
        <p-button label="Editar" icon="pi pi-pencil" (click)="abrirDialogo()"></p-button>
      </ng-template>
    </div>
  </header>

  <p-table [value]="filasVista()" [loading]="loading()" styleClass="subcon-tabla">
    <ng-template pTemplate="header">
      <tr>
        <th>Clase de Uso</th>
        <th class="text-right">Valor</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-fila>
      <tr *ngIf="fila.tipo === 'grupo'; else filaClase" class="grupo">
        <td colspan="2">{{ fila.grupo }}</td>
      </tr>
      <ng-template #filaClase>
        <tr class="clase">
          <td>{{ fila.nombre }}</td>
          <td class="text-right">
            <span class="tipo" [class]="'tipo tono-' + fila.tono">{{ fila.etiqueta }}</span>
            <span class="valor-pct" [class]="'valor-pct tono-' + fila.tono">{{ fila.valorTexto }}</span>
          </td>
        </tr>
      </ng-template>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr><td colspan="2" class="subcon-vacio">Este período no tiene porcentajes registrados. Usá Agregar para cargarlos.</td></tr>
    </ng-template>
  </p-table>

  <p class="subcon-pie" *ngIf="resumen()">{{ resumen() }}</p>
</section>

<!-- Legacy SubCon.vue:61-212: one dialog with the nine clases; Guardar saves all of them in one request. -->
<p-dialog [header]="tituloDialogo()" [visible]="dialogVisible()" (visibleChange)="dialogVisible.set($event)" [modal]="true" [style]="{ width: '24rem' }">
  <div class="valor-editor" *ngFor="let c of clasesLegacy">
    <label [attr.for]="'subcon-' + c.clase">{{ c.nombre }}</label>
    <input
      pInputText
      [id]="'subcon-' + c.clase"
      type="number"
      step="any"
      inputmode="decimal"
      [ngModel]="valorDialogo(c.clase)"
      (ngModelChange)="onValorDialogoChange(c.clase, $event)"
    />
  </div>
  <ng-template pTemplate="footer">
    <p-button label="Guardar" icon="pi pi-check" (click)="confirmarGuardar()"></p-button>
    <p-button label="No" icon="pi pi-times" severity="secondary" (click)="cerrarDialogo()"></p-button>
  </ng-template>
</p-dialog>

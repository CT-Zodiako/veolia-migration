<p-toast></p-toast>

<div class="card-section">
  <div class="filters">
    <app-aps-selector [selectedAps]="aps()" (selectedApsChange)="onApsChange($event)" label="APS"></app-aps-selector>
    <app-anno-selector [selectedAnno]="anno()" (selectedAnnoChange)="onAnnoChange($event)" label="Año"></app-anno-selector>
    <app-mes-selector [selectedMes]="mes()" (selectedMesChange)="onMesChange($event)" label="Mes"></app-mes-selector>
  </div>
</div>

<div class="card-section">
  <p-table [value]="clases()" [loading]="loading()" [tableStyle]="{ 'min-width': '30rem' }">
    <ng-template pTemplate="header">
      <tr>
        <th>Clase de Uso</th>
        <th class="text-right">Valor (%)</th>
        <th>Acciones</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-item>
      <tr>
        <td>{{ item.nombre }}</td>
        <td class="text-right">
          <div *ngIf="editingClase() === item.clase; else valorReadonly" class="valor-editor">
            <input
              pInputText
              type="number"
              step="any"
              inputmode="decimal"
              [ngModel]="editingValor()"
              (ngModelChange)="onEditingValorChange($event)"
              aria-label="Valor de subsidio o contribución"
            />
            <span aria-hidden="true">%</span>
          </div>
          <ng-template #valorReadonly>{{ item.valor !== null ? (item.valor + '%') : '-' }}</ng-template>
        </td>
        <td class="actions">
          <ng-container *ngIf="editingClase() === item.clase; else accionEditar">
            <p-button icon="pi pi-check" severity="success" size="small" (click)="confirmarGuardar(item)"></p-button>
            <p-button icon="pi pi-times" severity="secondary" size="small" (click)="cancelarEdicion()"></p-button>
          </ng-container>
          <ng-template #accionEditar>
            <p-button icon="pi pi-pencil" severity="info" size="small" (click)="iniciarEdicion(item)"></p-button>
          </ng-template>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="3">Seleccione APS, año y mes para ver los valores.</td>
      </tr>
    </ng-template>
  </p-table>
</div>

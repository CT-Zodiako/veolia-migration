<div class="layout-container">
  <aside class="sidebar" [class.collapsed]="sidebarCollapsed">
    <div class="sidebar-header">
      <div class="sidebar-header-text">
        <img src="/Veolia_sml.png" alt="Veolia" class="sidebar-logo" />
        <p>{{ nombreSistema }}</p>
      </div>
      <button
        type="button"
        class="sidebar-toggle"
        [title]="sidebarCollapsed ? 'Expandir menú' : 'Contraer menú'"
        (click)="toggleSidebar()"
      >
        <i class="pi" [class.pi-angle-double-right]="sidebarCollapsed" [class.pi-angle-double-left]="!sidebarCollapsed"></i>
      </button>
    </div>

    <nav class="sidebar-nav">
      <div *ngFor="let section of menuSections" class="menu-section">
        <div *ngIf="section.label" class="menu-section-title">{{ section.label }}</div>

        <div *ngFor="let group of section.groups" class="menu-group" [class.group-active]="isGroupActive(group)">
          <!-- Ítem realmente suelto (sin agrupación real: el nodo hoja se envuelve
               como "grupo" de un solo hijo con el mismo label) -> link directo -->
          <a
            *ngIf="isLooseItem(group)"
            [routerLink]="group.children[0].path"
            class="nav-item"
            [class.active]="isActive(group.children[0].path)"
            [title]="group.children[0].label"
          >
            <i class="nav-icon pi" [ngClass]="lineIcon(group)"></i>
            <span class="nav-label">{{ group.children[0].label }}</span>
          </a>

          <!-- Grupo real (label de grupo distinto al del hijo, o más de un hijo):
               siempre mostrar el padre con sus hijos adentro, sin importar la cantidad -->
          <ng-container *ngIf="!isLooseItem(group)">
            <button
              type="button"
              class="nav-item menu-parent"
              [class.expanded]="group.expanded"
              [class.parent-active]="isGroupActive(group)"
              [title]="group.label"
              (click)="toggleExpand(group)"
            >
              <i class="nav-icon pi" [ngClass]="lineIcon(group)"></i>
              <span class="nav-label">{{ group.label }}</span>
              <i class="nav-arrow pi" [class.pi-angle-down]="group.expanded" [class.pi-angle-right]="!group.expanded"></i>
            </button>

            <div *ngIf="group.expanded" class="submenu">
              <a
                *ngFor="let item of group.children"
                [routerLink]="item.path"
                class="submenu-item"
                [class.active]="isActive(item.path)"
              >
                <span class="submenu-dot"></span>
                <span class="submenu-label">{{ item.label }}</span>
              </a>
            </div>
          </ng-container>
        </div>
      </div>
    </nav>

    <div class="sidebar-user" [title]="usuarioNombre">
      <span class="sidebar-user-avatar">{{ usuarioInicial }}</span>
      <div class="sidebar-user-text">
        <span class="sidebar-user-name">{{ usuarioNombre }}</span>
        <span class="sidebar-user-status">Sesión activa</span>
      </div>
    </div>
  </aside>

  <main class="main-content" [class.collapsed]="sidebarCollapsed">
    <header class="top-bar">
      <div class="top-bar-heading">
        <div *ngIf="getBreadcrumb() as breadcrumb" class="top-bar-breadcrumb">{{ breadcrumb }}</div>
        <div class="top-bar-title">{{ getPageTitle() }}</div>
      </div>
      <div class="top-bar-actions">
        <button
          type="button"
          class="theme-toggle-button"
          [title]="themeService.oscuro() ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
          (click)="themeService.toggle()"
        >
          <i class="pi" [class.pi-sun]="themeService.oscuro()" [class.pi-moon]="!themeService.oscuro()"></i>
        </button>
        <div class="sistema-switch-container" *ngIf="sistemasDisponibles.length > 1">
          <button
            type="button"
            class="sistema-switch-button"
            [disabled]="cambiandoSistema"
            (click)="showSistemaDropdown = !showSistemaDropdown"
          >
            <i class="pi" [class.pi-building]="!cambiandoSistema" [class.pi-spinner]="cambiandoSistema" [class.pi-spin]="cambiandoSistema"></i>
            <span>{{ nombreSistema }}</span>
            <i class="pi pi-angle-down sistema-switch-chevron"></i>
          </button>

          <div *ngIf="showSistemaDropdown" class="sistema-dropdown">
            <button
              *ngFor="let sistema of sistemasDisponibles"
              type="button"
              class="sistema-dropdown-item"
              [class.active]="sistema.SIST_ID === sistemaSeleccionadoId"
              (click)="cambiarSistema(sistema.SIST_ID); showSistemaDropdown = false"
            >
              {{ sistema.SIST_NOMBRE }}
            </button>
          </div>
        </div>
        <app-profile></app-profile>
      </div>
    </header>

    <div class="content-area">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>

<app-support-error-log-panel *ngIf="usuario?.esSoporte === true"></app-support-error-log-panel>
<app-ayuda-flotante></app-ayuda-flotante>

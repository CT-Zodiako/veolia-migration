<div class="profile-container">
  <button type="button" class="profile-button" (click)="toggleDropdown()">
    <span class="profile-avatar">{{ inicial() }}</span>
    <span class="profile-name">{{ nombre() }}</span>
    <i class="pi pi-angle-down profile-chevron"></i>
  </button>

  <div *ngIf="showDropdown" class="profile-dropdown">
    <div class="dropdown-header">
      <div class="name">{{ user()?.SISU_NOMBRE }} {{ user()?.SISU_APELLIDO }}</div>
      <div class="email">{{ user()?.SISU_CORREO }}</div>
    </div>
    <p-button
      icon="pi pi-key"
      label="Cambiar Clave"
      [text]="true"
      severity="secondary"
      (click)="goToChangePass()"
      styleClass="w-full justify-content-start"
    ></p-button>
    <div class="dropdown-divider"></div>
    <p-button
      icon="pi pi-sign-out"
      label="Salir"
      [text]="true"
      severity="danger"
      (click)="logout()"
      styleClass="w-full justify-content-start"
    ></p-button>
  </div>
</div>
